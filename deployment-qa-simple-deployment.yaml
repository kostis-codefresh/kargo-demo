apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    codefresh.io/app: simple-go-app
  name: qa-simple-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trivial-go-web-app
  template:
    metadata:
      labels:
        app: trivial-go-web-app
    spec:
      containers:
      - env:
        - name: UI_THEME
          value: light
        - name: CACHE_SIZE
          value: 2048kb
        - name: PAGE_LIMIT
          value: "25"
        - name: SORTING
          value: ascending
        - name: N_BUCKETS
          value: "42"
        - name: ENV
          value: qa
        - name: GPU_ENABLED
          value: "1"
        - name: ENV_TYPE
          value: non-prod
        - name: PAYPAL_URL
          value: staging2.paypal.com
        - name: DB_USER
          value: non-prod-user
        - name: DB_PASSWORD
          value: non-prod-password
        image: docker.io/kostiscodefresh/simple-env-app:1.0
        imagePullPolicy: Always
        name: webserver-simple
        ports:
        - containerPort: 8080
