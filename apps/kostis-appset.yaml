apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kostis-demo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/kostis-codefresh/kargo-demo.git
      revision: HEAD
      directories:
      - path: kostis-demo/envs/*   
  template:      
    metadata:
      name: kostis-demo-{{index .path.segments 2}}
      annotations:
        kargo.akuity.io/authorized-stage: kostis-demo:{{index .path.segments 2}}
    spec:
      # The project the application belongs to.
      project: default

      # Source of the application manifests
      source:
        repoURL: https://github.com/kostis-codefresh/kargo-demo.git
        targetRevision: kostis/stage/{{index .path.segments 2}}
        path: .
      
      # Destination cluster and namespace to deploy the application
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 2}}'

      # Sync policy
      syncPolicy:
        syncOptions:
          - CreateNamespace=true  
        # automated: # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
        #   prune: true # Specifies if resources should be pruned during auto-syncing ( false by default ).
        #   selfHeal: true # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
      